- num: 9
  slug: analyzing-qualitative-data
  title: Analyzing Qualitative Data
  summary: >-
    Interviews, visits and tests leave a "wall of data." This chapter presents a repeatable way to
    climb it: process the raw material, build patterns by coding and grouping, then connect the
    patterns into insights and stories. It offers both a speedy and a heavyweight analysis plan.
  takeaways:
    - The three steps of qualitative analysis: process, pattern, insight.
    - Bottom-up versus top-down coding, and groups, grids and tags as ways to organize.
    - How affinity grouping works and when to use it.
    - How to describe people and processes, revisit codes, and build frameworks.
    - Typical lightweight and heavyweight analysis timelines.
  sections:
    - The basics of qualitative data analysis
    - How to do it
    - Typical analysis plans
    - Conclusion
  keywords: [qualitative data analysis, coding, affinity grouping, patterns, insights]
  tools: []
  links: []
  related: [6, 7, 14]

- num: 10
  slug: surveys
  title: Surveys
  summary: >-
    Surveys can tell you how many people do or think something, if they are carefully built. The
    chapter focuses on the brief online descriptive survey: when to run one, how to plan,
    schedule and write it, how to sample and recruit respondents, and how to analyze the
    answers, with warnings about the many ways surveys go wrong.
  takeaways:
    - When a survey is the right (and wrong) tool.
    - How to set one goal and plan the survey, including a realistic schedule.
    - Types of questions and common problems with their wording.
    - Sampling, sample size, response rates and non-response bias.
    - How to code open answers, count, cross-tabulate and judge significance.
  sections:
    - When to run surveys
    - How to field a survey
    - How to analyze survey responses
    - Conclusion
  keywords: [surveys, questionnaire design, sampling, sample size, Net Promoter Score, cross-tabulation]
  tools: [Qualtrics, SurveyMonkey]
  links: []
