- num: 12
  slug: working-with-groups
  title: Working with Groups
  summary: "Groups can show you social dynamics that one-on-one methods can't. They can also go wrong in ways one-on-one methods don't, which is why a lot of researchers avoid them. We don't think you should throw out a method because many people do it badly, so we show how to do it well: when to use groups, how to plan them (online or in a room), how to moderate and how to analyze what you get."
  takeaways:
    - "When working with a group is the right call, and when it's the worst one"
    - "How to plan activities, find participants and write a guide"
    - "How to prepare the space, physical or online, and record the session"
    - "How to moderate: full participation, neutrality, timekeeping, an assistant"
    - "How to analyze group session data"
  sections:
    - When to work with groups
    - How to run group activities
    - Conducting group activities
    - Analyzing group session data
    - Conclusion
  keywords: [group dynamics, focus groups, moderation, bias mitigation, groupthink, co-creation]
