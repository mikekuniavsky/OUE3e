# Chapter data for the companion site. One entry per chapter, in book order.
# Pages in /chapters/ read from this file (see _layouts/chapter.html), so edit
# titles, summaries and links here rather than in the page files.
#
# Fields
#   num        chapter number (matches the Zotero collection numbers)
#   slug       URL slug (chapters/<slug>/)
#   title      chapter title, in title case
#   summary    short original description (not book text)
#   takeaways  what you'll find in the chapter (list)
#   sections   main sections of the chapter, in order (list)
#   keywords   key terms (list)
#   tools      tools and organizations named in the chapter (list of plain text)
#   links      web links printed in the chapter: {label, url} (list)
#   related    chapter numbers to cross-reference (list)
#
# Open question flagged in the proofs: Chapter 11 is "Diary Studies" in the
# manuscript but is cited as "Learning Over Time" in other chapters and in Zotero.
# Change the title here once that is settled.

- num: 1
  slug: introduction
  title: "Introduction: The Uses of Research"
  summary: >-
    User experience research is the work of figuring out how an audience interprets and uses a
    designed artifact. The introduction argues that every organization already does some of it,
    formally or not, and that doing it systematically pays off. A case study of Airbnb's
    pandemic-era redesign shows what research-driven change looks like, and a section on "thick
    data" explains why a few good conversations can explain what logs and counts cannot.
  takeaways:
    - Why user research is not optional, and how it relates to "product-market fit."
    - How Airbnb used research to rebuild its guest and host experience during COVID-19.
    - The difference between thin (big) data and thick (qualitative) data.
    - Why the book treats methods as a cookbook rather than a fixed procedure.
    - What it means to be a champion for the people you research, not a box-ticker.
  sections:
    - What user research is for
    - "A case study in user-led innovation: Airbnb's pandemic redesign"
    - "Thick data: the power of qualitative research"
    - Methods matter
    - You need to be a UX research champion
    - The long and short view
  keywords: [user experience research, case study, organizational change, business value, thick data]
  tools: []
  links: []
  related: [2, 19]

- num: 2
  slug: program-roadmapping
  title: Program Roadmapping
  summary: >-
    Research needs a plan that connects individual studies to what the organization is trying to
    achieve. This chapter shows how to build that plan: start with a simple Now/Next/Later
    roadmap, then, if your program is complex enough to need it, an operational roadmap with
    prioritized concerns, written objectives, scoped projects and a timeline. It ends with a
    take on the "tactical versus strategic research" debate.
  takeaways:
    - How to build a basic Now/Next/Later roadmap in a few days.
    - How to collect and prioritize organizational concerns with stakeholder conversations.
    - How to write research objectives that are relevant, concrete and achievable.
    - How to scope projects and lay them out on an operational roadmap.
    - Why the tactical versus strategic distinction is better treated as two outcomes of one project.
  sections:
    - The basic roadmap
    - The operational roadmap
    - Collect concerns and prioritize them
    - Generate objectives
    - Scope projects
    - Make the map
    - Conclusion
  keywords: [research program, roadmap, Now-Next-Later, objectives, prioritization, stakeholders]
  tools: [Miro, Mural]
  links:
