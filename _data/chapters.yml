- num: 15
  slug: representing-insights-processes
  title: "Representing Insights: Processes"
  summary: "Tasks, journeys and services all describe what people do over time, at different scales. We show how to analyze each and how to draw it: flows, hierarchies and towers for tasks, journey maps, and service blueprints, with step-by-step instructions for the last two. Our advice at the end: simplify."
  takeaways:
    - "The difference between tasks, journeys and services, and which diagram fits which"
    - "How to draw a task as a flow, a hierarchical task analysis or a tower"
    - "How to build a journey map from participant data in six steps"
    - "How to make a service blueprint and mark what success looks like"
    - "Why simpler diagrams almost always win"
  sections:
    - Tasks
    - Journeys
    - Services
    - "Our last message: simplify"
  keywords: [task analysis, journey map, service blueprint, process mapping, hierarchical task analysis]
  tools: []
  links: []
  related: [14, 16, 11]

