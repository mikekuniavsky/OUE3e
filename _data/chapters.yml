- num: 6
  slug: interviewing
  title: Interviewing
  summary: "A research interview looks like a conversation, but it isn't one. You're trying to get people to open up without steering what they say. We cover the structure of an interview, a quickstart guide, writing questions that don't lead, handling observers, and what to do when the interviewee won't talk (or won't stop). The last sections cover sensitive topics and hands-on exercises: collage, maps and timelines."
  takeaways:
    - "How to balance a plan with improvisation"
    - "How to turn research questions into interview questions"
    - "How to keep observers from taking over"
    - "How to take notes that keep what you saw apart from what you think it means"
    - "Visual elicitation, collage, spatial and social mapping, and timelines"
  sections:
    - Interview basics
    - How to do it
    - Quickstart interview guide
    - How to write better interview questions
    - Running the interview
    - Sensitive contexts and hard topics
    - Hands-on activities
    - Conclusion
  keywords: [interviewing, interview guide, rapport, follow-up questions, visual elicitation, collage, trauma-informed research]
  tools: []
  links: []
  related: [7, 9, 12]

- num: 7
  slug: learning-from-observation
  title: Learning from Observation
  summary: "What people say they do and what they do can be far apart, so go and watch. Moen's showerhead designers did, in a place you might not expect. We cover field visits: how to recruit and schedule them, what to do once you're there, how to take notes, and how to answer \"Can't we just ask them?\""
  takeaways:
    - "What a field visit is, and how it differs from asking questions"
    - "How to plan and schedule visits, including videotaped and cross-cultural ones"
    - "How to structure a visit: introduction, main observation, wrap-up"
    - "Frameworks for what to look at, such as AEIOU and contextual inquiry"
    - "How to respond when someone says \"This takes too long\""
  sections:
    - What are field visits?
    - Before you go
    - While you're onsite
    - Why can't you just ask people?
    - Conclusion
  keywords: [ethnography, field visits, participant observation, contextual inquiry]
