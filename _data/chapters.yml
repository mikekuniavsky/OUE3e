- num: 6
  slug: interviewing
  title: Interviewing
  summary: >-
    A research interview is a guided conversation designed to produce honest, detailed
    accounts without leading the participant. The chapter covers the Greek-column structure of an
    interview, a quickstart interview guide, writing better questions, preparing observers,
    running the session, sensitive topics, and hands-on techniques such as visual elicitation,
    collage, mapping and timelines.
  takeaways:
    - How semi-structured interviews balance a plan with improvisation.
    - How to turn research questions into interview questions, and avoid leading ones.
    - How to prepare observers and keep them from derailing a session.
    - How to take notes that separate observation from interpretation.
    - How to use visual elicitation, collage, spatial and social mapping and timelines.
  sections:
    - Interview basics
    - How to do it
    - Quickstart interview guide
    - How to write better interview questions
    - Running the interview
    - Sensitive contexts and hard topics
    - Hands-on activities
    - Conclusion
  keywords: [interviewing, interview guide, rapport, follow-up questions, visual elicitation, collage, trauma-informed research]
  tools: []
  links: []
  related: [7, 9, 12]

- num: 7
  slug: learning-from-observation
  title: Learning from Observation
  summary: >-
    Watching people where they live and work shows what they do, not just what they say they
    do. The chapter explains what field visits are and when to use them, how to prepare (recruit,
    schedule, learn the domain, plan notes), how to run the visit, and how to answer the usual
    objections to doing fieldwork.
  takeaways:
    - What field visits are and how they differ from asking people questions.
    - How to plan and schedule visits, including video and cross-cultural visits.
    - A structure for a visit: introduction, main observation period, wrap-up.
    - Frameworks for what to watch (such as AEIOU) and contextual inquiry.
    - How to respond to "this takes too long" and similar objections.
  sections:
    - What are field visits?
    - Before you go
    - While you're onsite
    - Why can't you just ask people?
    - Conclusion
  keywords: [ethnography, field visits, participant observation, contextual inquiry]
  tools: []
  links: []
  related: [6, 9, 11]

- num: 8
  slug: usability-testing
  title: Usability Testing
  summary: >-
    A moderated usability test shows where people struggle to use a product and why. The
    chapter walks through five steps (make a plan, assemble the ingredients, run the tests,
    analyze, report) and then covers automated testing, accessibility-engaged testing and testing
    on mobile and wearable devices.
  takeaways:
    - How to write a test plan with goals, research questions, tasks and metrics.
    - How many participants you need and how to recruit and schedule them.
    - How to write a script and moderate without leading.
    - How to analyze notes and report findings people will act on.
    - How to adapt the method for automated, accessible and mobile testing.
  sections:
    - The basics of usability testing
    - How to do it
    - Make a plan
    - Assemble the ingredients
    - Run the tests
    - Analyze
    - Report out
    - Beyond the basics
    - Conclusion
  keywords: [usability testing, moderated testing, think-aloud protocol, usability metrics, accessibility]
  tools: []
  links: []
