- num: 12
  slug: working-with-groups
  title: Working with Groups
  summary: >-
    Group methods are valuable for studying social activities and for early exploration, but
    they carry risks that one-on-one methods do not. The chapter explains when to use groups, how
    to plan and schedule them (online or in person), write a guide, set up the space, moderate
    discussion, handle common problems and analyze what happens.
  takeaways:
    - When working with groups is the right choice (and when it is the worst one).
    - How to plan activities, find participants and write a group guide.
    - How to prepare physical and online spaces and record sessions.
    - How to moderate: full participation, neutrality, timekeeping, assistant moderators.
    - How to analyze group session data.
  sections:
    - When to work with groups
    - How to run group activities
    - Conducting group activities
    - Analyzing group session data
    - Conclusion
  keywords: [group dynamics, focus groups, moderation, bias mitigation, groupthink, co-creation]
  tools: []
  links: []
  related: [4, 6, 17]

- num: 13
  slug: findability-and-navigation
  title: Findability and Navigation
  summary: >-
    A collection of specialized methods for checking whether people can find information and
    functionality and get where they are going. It covers open and closed card sorting, tree
    tests, first-click testing, navigation path analysis, eye and gesture tracking and
    search-based findability, and ends by tying them to customer journeys and service design.
  takeaways:
    - How to run open and closed card sorts and analyze them informally or with cluster analysis.
    - How tree tests evaluate a hierarchy of categories.
    - How first-click testing and information scent diagnose navigation.
    - What navigation path analysis and eye tracking can and cannot show.
    - How to think about search as part of findability.
  sections:
    - Organizing information findably
    - Streamlining navigation
    - Card sorting
    - Tree tests
    - First click testing
    - Navigation path analysis
    - Eye and gesture tracking
    - Search-based findability
    - Conclusion
  keywords: [findability, navigation, card sorting, tree tests, first click, eye tracking, information architecture]
  tools: [Optimal Workshop, FigJam, UXTweak, Google Analytics, Adobe Customer Journey Analytics, Mixpanel, Tobii]
  links:
