- num: 9
  slug: analyzing-qualitative-data
  title: Analyzing Qualitative Data
  summary: "After the interviews and visits you're left with what we call the wall of data. Here's how to climb it: label what you've got, group it into patterns, and turn the patterns into insights and stories. We give you a fast way and a thorough way, and help you decide which to use."
  takeaways:
    - "The three steps: process the data, find patterns, develop insights"
    - "Top-down and bottom-up coding, and organizing with groups, grids or tags"
    - "How affinity grouping works"
    - "How to describe people and processes and connect groups into frameworks"
    - "What a lightweight and a heavyweight analysis plan look like"
  sections:
