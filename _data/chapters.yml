- num: 14
  slug: representing-insights-people
  title: "Representing Insights: People"
  summary: "Personas are popular and controversial. This chapter opens with King Charles and Ozzy Osbourne, whom an ad-targeting algorithm can't tell apart, and goes on to the three kinds of persona (goal-driven, role-based and behavioral archetypes), how to make one from your data, how to juggle several, what proto-personas are good for and what to say to people who can't stand personas."
  takeaways:
    - "The three kinds of persona and what each is good for"
    - "How to pick factors that matter (hint: not marketing demographics)"
    - "How to build a persona and decide which ones to prioritize"
    - "How to use personas to generate ideas and settle arguments"
    - "How to keep personas from going stale"
  sections:
