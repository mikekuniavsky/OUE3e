- num: 14
  slug: representing-insights-people
  title: "Representing Insights: People"
  summary: >-
    Once you have data about people, you need a way to share it that teams will remember and
    use. This chapter covers personas: goal-driven personas, role-based personas and behavioral
    archetypes; how to make one from research (choosing meaningful factors, finding shared
    factors and differences); how to work with several; proto-personas; and the common
    criticisms of personas.
  takeaways:
    - The three types of personas and what each emphasizes.
    - How to pick meaningful factors and avoid marketing demographics.
    - How to build a persona and decide which ones to prioritize.
    - How to use personas to generate ideas and resolve conflicts.
    - How to keep personas fresh over time.
  sections:
    - Types of personas
    - How to make a persona
    - Working with multiple personas
    - Proto-personas, and a warning
    - Make personas useful
    - "Persona non grata? Common challenges with personas"
    - Conclusion
  keywords: [personas, behavioral archetypes, goal-driven personas, role-based personas, proto-personas]
  tools: []
  links:
    - label: Brenda Hoyle's work (persona examples)
      url: https://brendahoyle.notion.site/
