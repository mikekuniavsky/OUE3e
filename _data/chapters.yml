- num: 19
  slug: organizational-power
  title: Organizational Power
  summary: >-
    The last chapter asks the "so what?" question: research exists to change decisions. It
    introduces information velocity, shows how to analyze your organization's culture and
    stakeholder relationships, how to pick projects for impact and communicate strategically, and
    why outcomes matter more than methods or titles.
  takeaways:
    - "A model for growing research influence: understand the organization, communicate strategically, find allies, shape action."
    - How to gather data about organizational culture and name what matters.
    - How to map primary and secondary stakeholders and power dynamics.
    - How to pick projects for impact.
    - Why to focus on outcomes over methods and titles.
  sections:
    - Information velocity
    - Analyze your organizational culture
    - Pick projects for impact
    - Well, so what?
  keywords: [organizational power, research impact, stakeholders, strategic communication, organizational change]
