# Chapter data for the companion site. One entry per chapter, in book order.
# Pages in /chapters/ read from this file (see _layouts/chapter.html), so edit
# titles, summaries and links here rather than in the page files.
#
# Fields
#   num        chapter number (matches the Zotero collection numbers)
#   slug       URL slug (chapters/<slug>/)
#   title      chapter title, in title case
#   summary    short original description (not book text)
#   takeaways  what you'll find in the chapter (list)
#   sections   main sections of the chapter, in order (list)
#   keywords   key terms (list)
#   tools      tools and organizations named in the chapter (list of plain text)
#   links      web links printed in the chapter: {label, url} (list)
#   related    chapter numbers to cross-reference (list)
#
# Open question flagged in the proofs: Chapter 11 is "Diary Studies" in the
# manuscript but is cited as "Learning Over Time" in other chapters and in Zotero.
# Change the title here once that is settled.

- num: 1
  slug: introduction
  title: "Introduction: The Uses of Research"
  summary: "Why research? Because somebody in your organization is already doing it, whether or not anyone calls it that. We start with Airbnb's pandemic redesign, then make the case for qualitative research: a few good conversations can tell you why, which no log file will. And we ask you to be your users' champion, not a box-ticker."
  takeaways:
    - "Why every organization does user research, even when nobody calls it that"
    - "How Airbnb used research to get through the pandemic"
    - "Thick data versus thin data, and why you need both"
    - "Why we think of the methods as a cookbook, not a procedure"
    - "What it means to be your users' champion"
  sections:
    - What user research is for
    - "A case study in user-led innovation: Airbnb's pandemic redesign"
    - "Thick data: the power of qualitative research"
    - Methods matter
    - You need to be a UX research champion
    - The long and short view
  keywords: [user experience research, case study, organizational change, business value, thick data]
  tools: []
  links: []
  related: [2, 19]

- num: 2
  slug: program-roadmapping
  title: Program Roadmapping
  summary: "Before you plan a study, you need to know why you're doing research at all. We start small, with a Now/Next/Later roadmap you can sketch in a few days, then grow it into an operational roadmap with written objectives, scoped projects and a timeline. Along the way: how to rank your stakeholders' worries, why it's better to disappoint people early, and why \"tactical versus strategic\" is the wrong argument."
  takeaways:
    - "How to sketch a Now/Next/Later roadmap in a few days"
    - "How to collect your stakeholders' concerns and rank them"
    - "How to write objectives you can actually achieve"
    - "How to scope projects and put them on a timeline"
    - "Why tactical and strategic research aren't opposites"
  sections:
    - The basic roadmap
    - The operational roadmap
    - Collect concerns and prioritize them
    - Generate objectives
    - Scope projects
    - Make the map
    - Conclusion
  keywords: [research program, roadmap, Now-Next-Later, objectives, prioritization, stakeholders]
  tools: [Miro, Mural]
