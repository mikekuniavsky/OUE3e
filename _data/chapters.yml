      url: https://medium.com/hubspot-product/roadmapping-for-more-strategic-research-f6052b588bfc
    - label: "Judd Antin: first researcher starter pack"
      url: https://medium.com/onebigthought/first-researcher-starter-pack-199859e278de
    - label: "Strategic vs. tactical research (User Interviews)"
      url: https://www.userinterviews.com/blog/strategic-vs-tactical-research
    - label: "Raz Schwartz: 4 myths about tactical research (Spotify)"
