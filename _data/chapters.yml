- num: 15
  slug: representing-insights-processes
  title: "Representing Insights: Processes"
  summary: >-
    Some research is about what people do over time. This chapter shows three ways to represent
    processes: tasks (flows, hierarchies and towers), journeys (journey maps, with a step-by-step
    method) and services (service blueprints, with a step-by-step method), including how to
    analyze data for each.
  takeaways:
    - The difference between tasks, journeys and services, and which diagram fits each.
    - How to analyze and represent tasks as flows, hierarchical task analyses and towers.
    - How to build a journey map from participant data in six steps.
    - How to make a service blueprint and call out measures of success.
    - Why simpler diagrams are usually better.
  sections:
    - Tasks
    - Journeys
    - Services
    - "Our last message: simplify"
  keywords: [task analysis, journey map, service blueprint, process mapping, hierarchical task analysis]
  tools: []
  links: []
  related: [14, 16, 11]

- num: 16
  slug: representing-insights-systems
  title: "Representing Insights: Systems"
  summary: >-
    Systems diagrams show how the thing you are designing sits inside a larger whole. The chapter
    covers ecosystem maps (with a step-by-step method), structured concept models, and
    experience frameworks, including a catalog of common diagram formats and how to sketch your
    own.
  takeaways:
    - What an ecosystem is and how to map it with concentric circles.
    - How concept models use nodes, links and propositions.
    - How experience frameworks summarize relationships among research themes.
    - Common formats: hub and spoke, bullseye, backbone, tree, Venn, matrix, metaphors.
    - Why to start with freehand sketching.
  sections:
    - What you'll need before you start
    - Ecosystems
    - Structured concept models
    - Experience frameworks
    - Conclusion
  keywords: [ecosystem map, concept model, experience framework, systems, diagrams]
  tools: [Lucidchart]
  links: []
