- num: 8
  slug: usability-testing
  title: Usability Testing
  summary: "A moderated usability test shows you where people get stuck, and why. We walk through it in five steps: plan, assemble, run, analyze and report. Then we look at what changes for automated tests, tests that include people who use assistive technology, and tests on mobile and wearable devices."
  takeaways:
    - "How to write a test plan with goals, questions, tasks and metrics"
    - "How many participants you need, and how to recruit and schedule them"
    - "How to write a script and moderate without leading"
    - "How to analyze your notes and write a report people act on"
    - "How to adapt the method for automated, accessible and mobile testing"
  sections:
