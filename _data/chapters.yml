- num: 17
  slug: reports-presentations-and-workshops
  title: Reports, Presentations, and Workshops
  summary: >-
    Research only has an effect when people understand and use it. The chapter covers choosing a
    format, informal and formal reports, tactics for making reports compelling, giving
    presentations (including using video), running interpretation workshops and going beyond
    delivering deliverables to delivering results.
  takeaways:
    - How to match a report's format to its audience.
    - The parts of a formal report and how to test one with stakeholders.
    - Tactics: lead with the striking finding, get concrete, make the takeaway the title.
    - How to avoid common presentation pitfalls.
    - How to plan and run workshops to build empathy, find implications and solve problems.
  sections:
