- num: 3
  slug: research-project-planning
  title: Research Project Planning
  summary: >-
    A project plan turns research objectives into something a team can approve and carry out.
    The chapter starts with a one-page minimal plan, then covers the thorough version: goals,
    research questions, methods (including mixed-methods patterns), participants, data handling,
    outcomes, logistics and risks, and how to share the plan and get support for it.
  takeaways:
    - The six things every research plan needs, even for a quick usability test.
    - How to refine broad research questions into ones you can actually answer.
    - How to choose among foundational, evaluative and generative projects and pick methods.
    - The main mixed-methods patterns (explanatory sequential, exploratory sequential, convergent).
    - How to estimate time, budget and risk, and answer the objections a plan usually gets.
  sections:
    - The minimal project plan
    - The thorough plan
    - Write up the goals section
    - Select methods
    - The rest of the plan
    - Share and revise
    - Conclusion
  keywords: [research questions, project objectives, project planning, logistics, mixed methods, research ethics]
  tools: []
  links: []
  related: [2, 4, 18]

- num: 4
  slug: recruiting
  title: Recruiting
  summary: >-
    The quality of your recruiting is the biggest determinant of the insights you gain. The
    chapter explains profiling (who are the right people), sizing the sample, sourcing, screening,
    and coordinating schedules, consent and incentives, with an emphasis on doing it yourself and
    knowing what paid services do for you. It closes with the common ways recruiting goes wrong.
  takeaways:
    - How to turn a theoretical population into an unambiguous research profile.
    - How many participants to recruit, using a table or a formula.
    - Ways to find people: requests, intercepts, advertising, paid panels.
    - How to write a screener and keep fraudulent respondents out.
    - How to handle consent, incentives and scheduling, and avoid no-shows and sourcing bias.
  sections:
    - How recruiting works
    - Profiling
    - Decide how many people you need
    - Sourcing participants
    - Screening responders
    - Coordinating
    - Paying for help
    - Recruiting pitfalls
    - Conclusion
  keywords: [recruiting, screener, profiling, sampling, theoretical population, incentives, informed consent]
  tools: []
  links: []
  related: [3, 10, 18]

- num: 5
  slug: desk-research
  title: Desk Research
  summary: >-
    Before collecting new data, find out what is already known. This chapter covers reviewing
    your organization's own research, searching academic, industry, government and think-tank
    sources, judging research quality quickly, and doing your own heuristic and competitive
    analyses. It ends with how to put the findings to use and where desk research runs out.
  takeaways:
    - How to assess what your organization already knows, and what to do when it knows little.
    - A skimmer's guide to reading academic papers.
    - Where to find industry, think-tank and government research.
    - How to spot red flags and green lights in research quality.
    - How to run a heuristic evaluation and a competitive analysis.
  sections:
    - "Internal research: what do you have?"
    - "External research: what do other people know?"
    - Quickly evaluate research quality
    - "Explore on your own: heuristics and competitive analysis"
    - Do something with what you learned
    - The limits of desk research
  keywords: [desk research, competitive analysis, literature review, heuristic evaluation, secondary research]
  tools: [Google Scholar, Zotero, NotebookLM, Mendeley, Paperpile]
  links:
