- num: 13
  slug: findability-and-navigation
  title: Findability and Navigation
  summary: "Can people find what they're looking for, and can they get where they're going? We cover card sorting, tree tests, first-click tests, navigation path analysis, eye tracking and search. Along the way we meet Richard Ankrom, who fixed a confusing Los Angeles freeway interchange with a homemade sign."
  takeaways:
    - "How to run open and closed card sorts, and analyze them by eye or with cluster analysis"
    - "How tree tests check a hierarchy of categories"
    - "How first-click tests and information scent diagnose navigation"
    - "What path analysis and eye tracking can and can't tell you"
    - "How to think about search as part of findability"
  sections:
