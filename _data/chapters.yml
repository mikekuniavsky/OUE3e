- num: 11
  slug: diary-studies
  title: Diary Studies
  summary: >-
    A diary study asks participants to record their activities over time, giving you a view of
    experiences that stretch across days, places and devices. The chapter covers when to use
    diaries, cultural probes, self-reporting, choosing a platform (paper, voicemail, apps),
    writing instructions and forms, running the study and analyzing the results.
  takeaways:
    - When diaries are better than interviews or observation.
    - How to design exercises and choose a platform.
    - How to write the introduction, instructions and questionnaires.
    - How to keep participants engaged with incentives and reminders.
    - How to analyze entries and follow up with participants.
  sections:
    - When to do a diary study
    - How to do it
    - Preparation and designing the study
    - Conducting a diary study
    - Follow-up activities
    - Conclusion
  keywords: [diary studies, cultural probes, self-reporting, experience over time]
  tools: []
  links:
