- num: 3
  slug: research-project-planning
  title: Research Project Planning
  summary: "Planning a research project is about as complicated as throwing a party, and you wouldn't throw one without a list. We start with a minimal plan that fits on one page, then build the thorough one: goals, questions, methods, participants, data, logistics and risks. We also cover mixing methods, and what to say to people who'd rather have the results tomorrow."
  takeaways:
    - "The six things every plan needs, even for a quick usability test"
    - "How to turn vague questions into ones you can answer"
    - "Foundational, evaluative and generative projects, and which methods fit each"
    - "Three patterns for mixing methods"
    - "How to answer \"Anecdotes aren't data\" and other objections"
  sections:
    - The minimal project plan
    - The thorough plan
    - Write up the goals section
    - Select methods
    - The rest of the plan
    - Share and revise
    - Conclusion
  keywords: [research questions, project objectives, project planning, logistics, mixed methods, research ethics]
  tools: []
  links: []
  related: [2, 4, 18]

- num: 4
  slug: recruiting
  title: Recruiting
  summary: "Who you talk to matters more than almost anything else you do. We show how to decide who the right people are, how many you need, where to find them, how to screen out the wrong ones and how to get everyone to show up. Rule number one: do whatever it takes to find people who have the relevant experience."
  takeaways:
    - "How to write a profile that leaves no doubt about who's in and who's out"
    - "How many people you need, by table or by formula"
    - "Ways to find them: asking, intercepting, advertising, paying a panel"
    - "How to write a screener and keep out fraudulent respondents"
    - "Consent, incentives and scheduling, and what goes wrong (no-shows, biased sourcing)"
  sections:
    - How recruiting works
    - Profiling
    - Decide how many people you need
    - Sourcing participants
    - Screening responders
    - Coordinating
    - Paying for help
    - Recruiting pitfalls
    - Conclusion
  keywords: [recruiting, screener, profiling, sampling, theoretical population, incentives, informed consent]
  tools: []
  links: []
  related: [3, 10, 18]

- num: 5
  slug: desk-research
  title: Desk Research
  summary: "Desk research is the kind you can do alone, in your pajamas. Before you collect anything new, find out what your organization, other researchers, governments and your competitors already know. We show how to read academic papers without reading all of them, how to tell good research from the official-looking kind, and how to run a heuristic review and a competitive analysis. Then we tell you what desk research can't do."
  takeaways:
    - "What to do when your organization knows a lot, or very little, about its users"
    - "How to skim an academic paper"
    - "Where to find industry, think-tank and government research"
    - "The red flags and green lights of research quality"
    - "How to run a heuristic evaluation and a competitive analysis"
  sections:
    - "Internal research: what do you have?"
    - "External research: what do other people know?"
    - Quickly evaluate research quality
    - "Explore on your own: heuristics and competitive analysis"
    - Do something with what you learned
    - The limits of desk research
  keywords: [desk research, competitive analysis, literature review, heuristic evaluation, secondary research]
  tools: [Google Scholar, Zotero, NotebookLM, Mendeley, Paperpile]
  links:
    - label: Google Scholar
      url: https://scholar.google.com
    - label: NotebookLM
      url: https://notebooklm.google.com
    - label: Think. Check. Submit. (judging a publication's credibility)
      url: https://thinkchecksubmit.org/
