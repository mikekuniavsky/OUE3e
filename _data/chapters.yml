- num: 11
  slug: diary-studies
  title: Diary Studies
  summary: "Some experiences don't happen in one place or at one time. A diary study asks participants to keep track for you. We cover when diaries beat interviews, how to choose a platform (paper, voicemail or an app), how to write the instructions and forms, how to keep people writing and what to do with the entries. There's also a short section on cultural probes."
  takeaways:
    - "When a diary beats an interview or a visit"
    - "How to design the exercises and pick a platform"
    - "How to write the introduction, instructions and forms"
    - "How to keep participants going with incentives and reminders"
    - "How to analyze the entries and follow up"
  sections:
