- num: 10
  slug: surveys
  title: Surveys
  summary: "Surveys fail. Often. Usually because people think they're easy. We stick to the brief online survey: when to run one, how to plan it, write the questions, find respondents and make sense of the answers, with plenty of warnings about the ways it can go wrong."
  takeaways:
    - "When a survey is the right tool, and when it isn't"
    - "How to pick one goal and plan a realistic schedule"
    - "Question types, and the common ways questions go wrong"
    - "Sampling, sample size, response rates and non-response bias"
    - "How to code open answers, count, cross-tabulate and judge significance"
  sections:
