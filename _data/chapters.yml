- num: 18
  slug: research-ops
  title: Research Ops
  summary: >-
    As research grows, so does the work of keeping it efficient, compliant and reusable. This
    chapter defines research operations and its eight pillars, then covers governance and
    participant data privacy, participant management and panels, program management (tools,
