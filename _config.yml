title: Observing the User Experience
description: Companion site for the third edition, by Elizabeth Goodman and Mike Kuniavsky
theme: just-the-docs

url: https://mikekuniavsky.github.io/OUE3e

# Navigation and search (Just the Docs)
search_enabled: true
search:
  heading_level: 2
  previews: 3
  preview_words_before: 5
  preview_words_after: 10
heading_anchors: true
back_to_top: true
back_to_top_text: "Back to top"

aux_links:
  "Zotero library":
    - "https://www.zotero.org/groups/5691168/oue/library"
  "GitHub":
    - "https://github.com/mikekuniavsky/OUE3e"
aux_links_new_tab: true

callouts:
  note:
    title: Note
    color: blue


# Pages without an explicit layout use the theme's default layout
defaults:
  - scope:
      path: ""
    values:
      layout: default

# Keep helper files out of the built site
exclude:
  - scripts/
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor/
